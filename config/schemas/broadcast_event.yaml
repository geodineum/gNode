contract:
  name: broadcast_event
  component: gnode
  version: "1.1.0"
  stability: stable
  stream: "{topology_ns}:gnode:broadcast:global"
  consumer_group: null
  purpose: >
    1:many event stream of a constellation. Every daemon reads it with XREAD
    from $ (no consumer group) and trims it to 5 minutes. site_registered,
    component_deployed, environment_changed, service_registered and
    service_deregistered make the daemon re-read site discovery at once; the
    60 s poll stays the reconciliation, so writers are best effort.

  fields:
    - name: type
      type: string
      required: true
      description: "Event type"
      example: "site_registered"
      values: "site_registered|component_deployed|environment_changed|service_registered|service_deregistered|topology_update|format_registered|global_announcement"

    - name: data
      type: json
      required: false
      description: "Event body. site_registered {site_id, environment, constellation, ts}; component_deployed {component, rev, node, ts}; environment_changed {site_id, new_environment, ts}"
      example: '{"site_id":"example_com","environment":"production","constellation":"geodineum","ts":1763200000}'

  xadd_example: >
    XADD {geodineum}:gnode:broadcast:global MAXLEN ~ 1000 *
    type site_registered
    data '{"site_id":"example_com","environment":"production","constellation":"geodineum","ts":1763200000}'

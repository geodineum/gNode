# Constellation Topology Schema — 24D (16 discovery + 8 storage)
# Tier: CONSTELLATION — nodes within a WireGuard VPN cluster
#
# Registers each node's role, capacity, placement and health, so that
# "which node is master?", "route to a GPU node", "find a node with a local
# ValKey replica" and "capacity planning" become discovery queries rather
# than hand-maintained configuration.
#
# ORDER IS LOAD-BEARING. discovery_point() is a prefix truncation, so dims
# 0..discovery_dimensions-1 form the spatial-hash bucket key and everything
# from discovery_dimensions upward is storage-only. A dimension a MEASUREMENT
# can change must therefore sit above the cut: registration reads static
# configuration, so a measured value placed below the cut bakes a config-time
# default into the bucket key and lets a query for "lightly loaded" silently
# match a number that was never live.
#
# Live values belong in z_score, which is range-queryable and updates without
# re-registration. compute_service_z_score reads dimension 16 — which is
# exactly why aggregate_load sits there.

schema_version: "4.0"
tier: constellation
total_dimensions: 24
discovery_dimensions: 16

dimensions:
  # ═══════════════════════════════════════════════════════════════
  # DISCOVERY BLOCK (0-15) — declared. Changes only by re-registration.
  # ═══════════════════════════════════════════════════════════════

  node_role:
    index: 0
    query_type: equality
    values:
      # Reads the estate, serves nothing, and must never be SELECTED for work.
      # An operator's workstation node watching live status is a member of the
      # constellation but not part of its capacity. `headless` was the closest
      # existing value and means "serves without a UI", which is the opposite
      # claim. Placed at 0.10 rather than re-spacing the ladder, so no already
      # registered node moves.
      observer: 0.10
      headless: 0.00
      edge: 0.20
      replica: 0.40
      full_node: 0.60
      master: 0.80
      coordinator: 1.00

  service_profile:
    index: 1
    query_type: equality
    values:
      headless: 0.00
      minimal: 0.25
      standard: 0.50
      full: 0.75
      custom: 1.00

  # Compatibility gates — a mismatch here means "cannot interoperate"
  geodineum_version:
    index: 2
    query_type: range
    values:
      v1: 0.20
      v2: 0.40
      v3: 0.60
      v4: 0.80
      v5: 1.00

  api_compatibility:
    index: 3
    query_type: range
    values:
      minimal: 0.00
      partial: 0.50
      full: 1.00

  valkey_mode:
    index: 4
    query_type: equality
    values:
      none: 0.00
      client_only: 0.33
      replica: 0.67
      primary: 1.00

  data_residency:
    index: 5
    query_type: equality
    values:
      global: 0.00
      na: 0.15
      eu: 0.30
      apac: 0.45
      sa: 0.60
      af: 0.75
      me: 0.90

  # Declared capacity CLASS, not live utilisation. A node's tier is a
  # property of the hardware under it; how busy it is right now is dim 16.
  storage_tier:
    index: 6
    query_type: equality
    values:
      ephemeral: 0.00
      ssd: 0.33
      high_iops: 0.67
      archival: 1.00

  cpu_tier:
    index: 7
    query_type: range
    values:
      minimal: 0.00
      standard: 0.33
      compute: 0.67
      gpu: 1.00

  memory_tier:
    index: 8
    query_type: range
    values:
      minimal: 0.00
      standard: 0.50
      high_memory: 1.00

  bandwidth_tier:
    index: 9
    query_type: range
    values:
      low: 0.00
      standard: 0.33
      high: 0.67
      dedicated: 1.00

  availability_zone:
    index: 10
    query_type: equality
    values:
      dr_site: 0.00
      secondary: 0.50
      primary: 1.00

  network_zone:
    index: 11
    query_type: equality
    values:
      isolated: 0.00
      vpn_only: 0.50
      vpn_plus_public: 1.00

  # The axis that makes a heterogeneous constellation addressable: declare a
  # node's specialisation and work can be steered to it by DISCOVERY, rather
  # than by which streams it happens to consume.
  specialization:
    index: 12
    query_type: equality
    values:
      general: 0.00
      inference: 0.25
      storage: 0.50
      compute: 0.75
      content: 1.00

  # Reserved. Width changes are expensive downstream — an .htt fixes its
  # semantic dimension count in the header at creation — so slots are held
  # open rather than appended later.
  semantic_reserved_1:
    index: 13
    query_type: equality
    values:
      unset: 0.00

  semantic_reserved_2:
    index: 14
    query_type: equality
    values:
      unset: 0.00

  semantic_reserved_3:
    index: 15
    query_type: equality
    values:
      unset: 0.00

  # ═══════════════════════════════════════════════════════════════
  # STORAGE BLOCK (16-23) — measured, visual, temporal.
  # Excluded from the bucket key. Never assume these are fresh in a
  # registered entity; read live values from the health stream or z_order.
  # ═══════════════════════════════════════════════════════════════

  # Dim 16 exactly: compute_service_z_score reads this index, so live load
  # becomes the sorted-set ordering behind "route to the least busy node"
  # without re-registering anything.
  aggregate_load:
    index: 16
    query_type: range
    values:
      idle: 0.00
      light: 0.25
      moderate: 0.50
      heavy: 0.75
      saturated: 1.00

  storage_available:
    index: 17
    query_type: range
    values:
      critical: 0.00
      low: 0.25
      adequate: 0.50
      ample: 0.75
      plenty: 1.00

  node_health:
    index: 18
    query_type: range
    values:
      dead: 0.00
      degraded: 0.33
      healthy: 0.67
      optimal: 1.00

  # Visual placement for the topology viewer. Storage-only by construction.
  vpn_position_x:
    index: 19
    query_type: range
    values:
      left: 0.00
      center: 0.50
      right: 1.00

  vpn_position_y:
    index: 20
    query_type: range
    values:
      front: 0.00
      center: 0.50
      back: 1.00

  vpn_position_z:
    index: 21
    query_type: range
    values:
      bottom: 0.00
      middle: 0.50
      top: 1.00

  join_order:
    index: 22
    query_type: range
    values:
      founding: 0.00
      early: 0.25
      middle: 0.50
      late: 0.75
      recent: 1.00

  storage_reserved_1:
    index: 23
    query_type: equality
    values:
      unset: 0.00

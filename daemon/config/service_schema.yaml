# Service Topology Schema — 23D (16 declared + 3 derived + 4 storage)
# Tier: LOCAL SERVICE — per-site service registration and discovery
# Used by: register-tools --tier service, gNode-Client getPublishedCapabilitySchema()
# Replaces: 30D v3.0 — clean break, pre-release
#
# Each dimension maps human-readable names to normalized [0.0, 1.0] coordinates.
#
# ORDER IS LOAD-BEARING. Both cuts are prefix truncations, so an axis's index IS
# its zone:
#
#   0 .. hashed_dimensions-1      DECLARED. Written by the provider at
#                                 registration and hashed into the spatial
#                                 bucket key. A measurement never belongs here:
#                                 a coordinate that moves would rewrite voxel
#                                 membership on every sample.
#   hashed .. discovery-1         DERIVED. Written only by the writer named in
#                                 `writer:`. A provider's value for one of these
#                                 is ignored, and a re-registration preserves
#                                 what the writer last wrote. Ranked in a query,
#                                 never hashed.
#   discovery .. total-1          STORAGE. Stored and returned, refused in a
#                                 query.
#
# On a derived axis, code 0.00 is `unknown` and never a real state. An unwritten
# coordinate has to abstain, not claim the first name in the enum — the 30D
# schema coded dead=0.00 and registering=0.00, so every live service read as
# dead and still registering.
#
# Per-axis query semantics (role, weight, prefer) are frozen in
# Geodineum-pro/tests/geometry-roles/SERVICE-AXIS-ROLES.reviewed.md and land here
# with the AXIS-ROLES engine, not before: a key nothing reads is a blank column.

schema_version: "4.0"
tier: service
total_dimensions: 23
discovery_dimensions: 19
hashed_dimensions: 16

dimensions:
  # ═══════════════════════════════════════════════════════════════
  # DECLARED, HASHED (0-15) — the provider's own claims.
  # Layer 1: Interface Identity (0-2) — how to communicate
  # ═══════════════════════════════════════════════════════════════

  protocol:
    index: 0
    query_type: equality
    values:
      undefined: 0.00
      http_rest: 0.10
      graphql: 0.20
      grpc: 0.30
      websocket: 0.40
      gnode_stream: 0.50
      resp3_direct: 0.60
      amqp: 0.70
      kafka: 0.80
      custom_tcp: 0.90

  api_version:
    index: 1
    query_type: equality
    values:
      undefined: 0.00
      v1: 0.10
      v2: 0.20
      v3: 0.30
      v4: 0.40
      v5: 0.50

  contract_stability:
    index: 2
    query_type: range
    values:
      experimental: 0.00
      alpha: 0.25
      beta: 0.50
      stable: 0.75
      frozen: 1.00

  # ═══════════════════════════════════════════════════════════════
  # Layer 2: Access Control (3-5) — who can use it
  # ═══════════════════════════════════════════════════════════════

  clearance_required:
    index: 3
    query_type: range
    values:
      public: 0.00
      authenticated: 0.20
      authorized: 0.40
      privileged: 0.60
      confidential: 0.80
      classified: 1.00

  auth_method:
    index: 4
    query_type: equality
    values:
      none: 0.00
      api_key: 0.20
      bearer_token: 0.40
      session_cookie: 0.60
      mtls: 0.80
      hardware_token: 1.00

  data_sensitivity:
    index: 5
    query_type: range
    values:
      public_data: 0.00
      internal: 0.25
      confidential: 0.50
      pii: 0.75
      regulated: 1.00

  # ═══════════════════════════════════════════════════════════════
  # Layer 3: Scope and Domain (6-9) — where it runs, what it does
  # ═══════════════════════════════════════════════════════════════

  service_scope:
    index: 6
    query_type: equality
    values:
      infrastructure: 0.00
      daemon: 0.15
      worker: 0.30
      cron_scheduled: 0.45
      internal_api: 0.60
      bff: 0.75
      client_facing: 0.90
      edge: 1.00

  domain_primary:
    index: 7
    query_type: proximity
    values:
      undefined: 0.00
      platform: 0.05
      identity: 0.10
      configuration: 0.15
      storage: 0.20
      cache: 0.25
      compute: 0.30
      transform: 0.35
      messaging: 0.40
      workflow: 0.45
      template: 0.50
      content: 0.55
      gateway: 0.60
      integration: 0.65
      analytics: 0.70
      logging: 0.75
      ml_inference: 0.80
      search: 0.85
      notification: 0.90
      presentation: 0.95

  domain_secondary:
    index: 8
    query_type: proximity
    values:
      undefined: 0.00
      platform: 0.05
      identity: 0.10
      configuration: 0.15
      storage: 0.20
      cache: 0.25
      compute: 0.30
      transform: 0.35
      messaging: 0.40
      workflow: 0.45
      template: 0.50
      content: 0.55
      gateway: 0.60
      integration: 0.65
      analytics: 0.70
      logging: 0.75
      ml_inference: 0.80
      search: 0.85
      notification: 0.90
      presentation: 0.95

  specialization:
    index: 9
    query_type: range
    values:
      platform: 0.00
      generalist: 0.25
      focused: 0.50
      specialist: 0.75
      single_purpose: 1.00

  # ═══════════════════════════════════════════════════════════════
  # Layer 4: Declared service levels (10-12) — promises, not measurements.
  # What a provider says it offers; the derived block is what it does.
  # ═══════════════════════════════════════════════════════════════

  throughput_tier:
    index: 10
    query_type: range
    values:
      minimal: 0.00
      standard: 0.25
      professional: 0.50
      enterprise: 0.75
      hyperscale: 1.00

  latency_class:
    index: 11
    query_type: range
    values:
      realtime: 0.00
      interactive: 0.25
      responsive: 0.50
      patient: 0.75
      batch: 1.00

  reliability_tier:
    index: 12
    query_type: range
    values:
      best_effort: 0.00
      standard: 0.25
      high: 0.50
      critical: 0.75
      ultra: 1.00

  # ═══════════════════════════════════════════════════════════════
  # Layer 5: Workflow and placement (13-15)
  # ═══════════════════════════════════════════════════════════════

  pipeline_stage:
    index: 13
    query_type: equality
    values:
      source: 0.00
      ingest: 0.20
      process: 0.40
      enrich: 0.60
      deliver: 0.80
      sink: 1.00

  execution_priority:
    index: 14
    query_type: range
    values:
      background: 0.00
      low: 0.25
      normal: 0.50
      high: 0.75
      critical: 1.00

  environment:
    index: 15
    query_type: equality
    # global serves every requested DTAP value; the reverse never holds.
    values:
      global: 0.00
      testing: 0.25
      staging: 0.50
      acceptance: 0.75
      production: 1.00

  # ═══════════════════════════════════════════════════════════════
  # DERIVED, RANKED, NEVER HASHED (16-18) — measured, not claimed.
  # `writer: sampler` means the daemon's sampler owns the value; a provider
  # sending one is ignored and a re-registration preserves the last measurement.
  # Dim 16 exactly: compute_service_z_score reads this index, so live load is
  # also the sorted-set ordering behind "route to the least busy provider".
  # ═══════════════════════════════════════════════════════════════

  current_load:
    index: 16
    query_type: range
    writer: sampler
    # derived from reply latency against the provider's own rolling baseline
    values:
      unknown: 0.00
      idle: 0.20
      light: 0.40
      moderate: 0.60
      heavy: 0.80
      saturated: 1.00

  health_status:
    index: 17
    query_type: equality
    writer: sampler
    # a category, not a scale: unknown is not 'worse than dead'
    values:
      unknown: 0.00
      dead: 0.33
      degraded: 0.67
      healthy: 1.00

  lifecycle_state:
    index: 18
    query_type: equality
    writer: daemon
    # the registration state machine writes this; registering=0.00 is honest for a fresh entity
    values:
      registering: 0.00
      active: 0.25
      draining: 0.50
      stopped: 0.75
      failed: 1.00

  # ═══════════════════════════════════════════════════════════════
  # STORAGE (19-22) — stored and returned, refused in a query.
  # Facts about a provider that no routing decision reads.
  # ═══════════════════════════════════════════════════════════════

  native_format:
    index: 19
    query_type: informational
    values:
      undefined: 0.00
      plaintext: 0.10
      json: 0.20
      xml: 0.30
      yaml: 0.40
      msgpack: 0.50
      protobuf: 0.60
      cbor: 0.70
      resp3: 0.80
      custom_binary: 0.90

  implementation_language:
    index: 20
    query_type: informational
    values:
      undefined: 0.00
      rust: 0.15
      php: 0.30
      lua: 0.45
      python: 0.55
      go: 0.65
      javascript: 0.75
      bash: 0.90

  data_persistence:
    index: 21
    query_type: informational
    values:
      stateless: 0.00
      ephemeral: 0.33
      persistent: 0.67
      replicated: 1.00

  service_tier:
    index: 22
    query_type: informational
    values:
      tool: 0.10
      service: 0.30
      pipeline: 0.50
      infrastructure: 0.70
      orchestrator: 0.90

# ═══════════════════════════════════════════════════════════════
# Capability profiles — 23-dim defaults per service archetype.
# `register-tools --tier service --site <id> --profile <name>` registers ONE
# entity (the site/service itself) from these defaults, instead of looping
# framework components. Dynamic dims (current_load/health/etc.) are
# daemon-populated and intentionally omitted. Value names MUST match the
# dimension `values:` enums above.
# ═══════════════════════════════════════════════════════════════
profiles:
  # A public-facing web site (e.g. a WordPress site served by gCore).
  web:
    - { name: protocol, value: http_rest }
    - { name: native_format, value: json }
    - { name: api_version, value: v1 }
    - { name: contract_stability, value: stable }
    - { name: clearance_required, value: public }
    - { name: auth_method, value: session_cookie }
    - { name: data_sensitivity, value: internal }
    - { name: service_scope, value: client_facing }
    - { name: domain_primary, value: presentation }
    - { name: domain_secondary, value: content }
    - { name: specialization, value: generalist }
    - { name: throughput_tier, value: standard }
    - { name: latency_class, value: interactive }
    - { name: reliability_tier, value: standard }
    - { name: pipeline_stage, value: deliver }

  # A headless API / BFF (no presentation layer).
  headless:
    - { name: protocol, value: http_rest }
    - { name: native_format, value: json }
    - { name: contract_stability, value: stable }
    - { name: clearance_required, value: authenticated }
    - { name: auth_method, value: bearer_token }
    - { name: data_sensitivity, value: internal }
    - { name: service_scope, value: bff }
    - { name: domain_primary, value: gateway }
    - { name: specialization, value: focused }
    - { name: throughput_tier, value: professional }
    - { name: latency_class, value: responsive }
    - { name: reliability_tier, value: high }
    - { name: pipeline_stage, value: deliver }

  # A generic internal backend service.
  service:
    - { name: protocol, value: gnode_stream }
    - { name: native_format, value: json }
    - { name: contract_stability, value: stable }
    - { name: clearance_required, value: authenticated }
    - { name: auth_method, value: api_key }
    - { name: data_sensitivity, value: internal }
    - { name: service_scope, value: internal_api }
    - { name: domain_primary, value: compute }
    - { name: specialization, value: focused }
    - { name: throughput_tier, value: standard }
    - { name: latency_class, value: responsive }
    - { name: reliability_tier, value: standard }
    - { name: pipeline_stage, value: process }

  # An infrastructure/system daemon.
  system:
    - { name: protocol, value: resp3_direct }
    - { name: native_format, value: resp3 }
    - { name: contract_stability, value: stable }
    - { name: clearance_required, value: privileged }
    - { name: auth_method, value: mtls }
    - { name: data_sensitivity, value: internal }
    - { name: service_scope, value: daemon }
    - { name: domain_primary, value: platform }
    - { name: specialization, value: specialist }
    - { name: throughput_tier, value: professional }
    - { name: latency_class, value: realtime }
    - { name: reliability_tier, value: critical }
    - { name: pipeline_stage, value: process }

  # A background worker / component.
  component:
    - { name: protocol, value: gnode_stream }
    - { name: native_format, value: json }
    - { name: contract_stability, value: stable }
    - { name: clearance_required, value: authenticated }
    - { name: auth_method, value: api_key }
    - { name: data_sensitivity, value: internal }
    - { name: service_scope, value: worker }
    - { name: domain_primary, value: compute }
    - { name: specialization, value: focused }
    - { name: throughput_tier, value: standard }
    - { name: latency_class, value: responsive }
    - { name: reliability_tier, value: standard }
    - { name: pipeline_stage, value: process }
